<svg xmlns="http://www.w3.org/2000/svg">
<!-- Hand gestures — reference for issue #168
     Parked due to spatial composition conflicts with props. -->

<symbol id="hand:call-me" viewBox="0 0 200 200">
    <path d="M 80 160 L 80 185 L 120 185 L 120 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <path d="M 75 110 C 75 95 88 90 100 90 C 112 90 125 95 125 110 L 125 160 L 75 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Thumb Up/Left to Ear -->
    <path d="M 80 110 C 65 105 45 80 35 65 C 28 55 42 48 52 58 C 65 72 75 92 82 100" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Pinky Down/Right to Mouth -->
    <path d="M 120 125 C 135 130 158 150 168 162 C 175 172 162 180 152 170 C 138 155 125 138 118 130" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:count-three" viewBox="0 0 200 200">
    <path d="M 75 165 L 75 185 L 125 185 L 125 165" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Base Palm -->
    <path d="M 70 115 C 70 100 80 95 90 95 L 110 95 C 120 95 130 100 130 115 L 130 165 L 70 165 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Thumb Left -->
    <path d="M 75 105 C 60 100 42 85 38 72 C 32 62 46 55 54 68 C 65 82 74 95 80 100" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Index Finger -->
    <path d="M 80 95 L 82 35 C 82 25 94 25 94 35 L 94 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Middle Finger -->
    <path d="M 98 95 L 102 30 C 102 20 114 20 114 30 L 112 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Ring & Pinky Curled Down -->
    <path d="M 112 95 C 112 120 130 120 130 95" fill="var(--secondary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:crossed-fingers" viewBox="0 0 200 200">
    <path d="M 75 160 L 75 185 L 125 185 L 125 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Folded Palm Body -->
    <path d="M 70 110 C 70 98 80 92 100 92 C 120 92 130 98 130 110 L 130 160 L 70 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Middle Finger Under/Swapped Left -->
    <path d="M 106 92 L 102 38 C 100 28 88 30 86 40 L 98 92" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index Finger Over/Swapped Right -->
    <path d="M 88 92 L 92 34 C 94 24 108 24 110 34 L 100 92" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Folded Ring & Pinky -->
    <path d="M 112 110 C 112 125 128 125 128 110" fill="var(--secondary)" stroke="var(--accent)" stroke-width="1.5" />
    <!-- Thumb Tuck -->
    <path d="M 70 120 C 82 115 95 118 100 125" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  </symbol>

<symbol id="hand:fist" viewBox="0 0 200 200">
    <path d="M 75 155 L 75 185 L 125 185 L 125 155" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Main Fist Box -->
    <path d="M 65 100 C 65 85 80 80 100 80 C 120 80 135 85 135 100 L 135 135 C 135 150 120 155 100 155 C 80 155 65 150 65 135 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Finger Segment Creases -->
    <path d="M 82 80 L 82 130 M 100 80 L 100 130 M 118 80 L 118 130" stroke="var(--accent)" stroke-width="1.5" />
    <!-- Thumb Wrapped Across -->
    <path d="M 65 120 C 75 110 105 110 120 125" fill="var(--secondary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:hand-heart" viewBox="0 0 200 200">
    <!-- Left Hand Half -->
    <path d="M 50 150 C 40 130 45 100 65 85 C 80 75 95 85 100 98 C 95 80 82 62 65 62 C 45 62 30 82 35 112 C 40 135 60 158 85 170 L 92 152 C 72 142 58 130 50 150 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Right Hand Half -->
    <path d="M 150 150 C 160 130 155 100 135 85 C 120 75 105 85 100 98 C 105 80 118 62 135 62 C 155 62 170 82 165 112 C 160 135 140 158 115 170 L 108 152 C 128 142 142 130 150 150 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:handshake" viewBox="0 0 200 200">
    <!-- Reaching Sleeve / Arm -->
    <path d="M 20 130 L 70 90 L 85 105 L 35 145 Z" fill="var(--secondary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Open Reaching Palm & Thumb -->
    <path d="M 70 90 L 120 65 C 130 60 138 72 128 80 L 100 100 L 140 90 C 150 88 155 100 145 106 L 105 120 L 135 112 C 145 110 148 122 138 128 L 100 138 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
  </symbol>

<symbol id="hand:holding-grip" viewBox="0 0 200 200">
    <path d="M 40 115 L 40 145 L 75 145 L 75 115" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Top Arc Fingers -->
    <path d="M 70 95 C 70 65 110 50 135 65 C 145 70 140 82 130 80 C 112 72 88 82 88 100" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Bottom Opposing Thumb Arc -->
    <path d="M 70 125 C 70 148 105 160 130 148 C 140 142 142 130 132 132 C 112 138 88 132 88 118" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:magic-casting" viewBox="0 0 200 200">
    <path d="M 75 165 L 75 185 L 125 185 L 125 165" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Clawed Splayed Hand -->
    <path d="M 60 115 C 50 105 58 90 70 98 L 78 104 L 70 50 C 68 40 80 38 84 48 L 92 95 L 95 38 C 95 28 108 28 108 38 L 106 95 L 122 48 C 124 38 136 40 134 50 L 125 104 L 138 68 C 142 58 152 62 148 72 L 138 122 C 132 152 120 165 100 165 C 78 165 66 142 60 115 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Energy Sparkles at Tips -->
    <circle cx="70" cy="38" r="4" fill="var(--secondary)" />
    <circle cx="101" cy="24" r="5" fill="var(--secondary)" />
    <circle cx="132" cy="36" r="4" fill="var(--secondary)" />
  </symbol>

<symbol id="hand:ok-sign" viewBox="0 0 200 200">
    <path d="M 80 160 L 80 185 L 120 185 L 120 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index + Thumb Circle -->
    <circle cx="82" cy="98" r="18" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <circle cx="82" cy="98" r="8" fill="none" stroke="var(--accent)" stroke-width="1.5" />
    <!-- 3 Extended Upward Fingers -->
    <path d="M 98 96 L 106 38 C 106 28 118 28 118 38 L 118 88 L 124 45 C 124 35 136 35 136 45 L 136 92 L 142 58 C 142 48 152 50 150 62 L 140 120 C 135 150 120 160 100 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:open-wave" viewBox="0 0 200 200">
    <path d="M 78 160 L 78 185 L 122 185 L 122 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <path d="M 60 110 C 50 100 58 85 70 92 L 78 98 L 78 45 C 78 35 90 35 90 45 L 90 90 L 98 38 C 98 28 110 28 110 38 L 110 90 L 118 45 C 118 35 130 35 130 45 L 130 92 L 136 58 C 136 48 148 50 146 62 L 140 120 C 136 150 125 160 100 160 C 78 160 66 140 60 110 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
  </symbol>

<symbol id="hand:peace" viewBox="0 0 200 200">
    <path d="M 75 165 L 75 185 L 125 185 L 125 165" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Palm Body -->
    <path d="M 70 115 C 70 100 80 95 90 95 L 110 95 C 120 95 130 100 130 115 L 130 165 L 70 165 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index Finger -->
    <path d="M 80 95 L 72 35 C 70 25 82 22 88 30 L 96 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Middle Finger -->
    <path d="M 104 95 L 112 30 C 114 20 126 22 128 32 L 120 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Folded Thumb over Ring/Pinky -->
    <path d="M 70 125 C 82 120 105 120 115 130" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  </symbol>

<symbol id="hand:pinch" viewBox="0 0 200 200">
    <path d="M 65 150 L 65 185 L 110 185 L 110 150" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Tapered Converging Fingers to Point -->
    <path d="M 65 130 C 60 100 90 55 120 45 C 128 42 135 50 128 58 C 110 70 95 100 95 130 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <path d="M 80 135 C 75 110 100 65 126 50 C 134 45 140 54 132 62 C 115 80 108 110 105 140 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="1.5" />
  </symbol>

<symbol id="hand:pointing" viewBox="0 0 200 200">
    <path d="M 35 110 L 35 145 L 60 145 L 60 110" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Index Finger Right -->
    <path d="M 55 90 L 155 90 C 168 90 168 108 155 108 L 115 108" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Curled Lower Fingers -->
    <path d="M 60 108 C 60 108 85 108 100 108 C 110 108 114 116 108 122 C 114 126 112 134 104 138 C 108 142 102 150 90 150 L 55 150 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Thumb Fold -->
    <path d="M 60 90 C 70 90 82 98 80 110" fill="none" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:prayer" viewBox="0 0 200 200">
    <!-- Left Forearm -->
    <path d="M 45 185 L 85 130 L 98 140 L 65 185 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Right Forearm -->
    <path d="M 155 185 L 115 130 L 102 140 L 135 185 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Joined Palms & Upward Fingers -->
    <path d="M 82 132 L 96 35 C 98 25 102 25 104 35 L 118 132 C 110 142 90 142 82 132 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
    <line x1="100" y1="35" x2="100" y2="135" stroke="var(--accent)" stroke-width="1.5" />
  </symbol>

<symbol id="hand:presenting" viewBox="0 0 200 200">
    <path d="M 25 130 L 25 160 L 65 160 L 65 130" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Flat Reaching Cup Palm -->
    <path d="M 60 118 L 155 102 C 168 100 172 114 160 120 L 145 128 L 155 122 C 165 120 168 132 156 136 L 138 142 L 145 138 C 152 136 154 148 142 150 L 110 158 C 85 162 65 145 60 118 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" />
    <!-- Thumb Raised Above Palm -->
    <path d="M 65 118 C 75 100 92 90 102 92 C 110 94 108 106 98 108 C 85 110 74 115 65 118 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="1.5" />
  </symbol>

<symbol id="hand:rock-on" viewBox="0 0 200 200">
    <path d="M 75 165 L 75 185 L 125 185 L 125 165" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <path d="M 70 115 C 70 100 80 95 90 95 L 110 95 C 120 95 130 100 130 115 L 130 165 L 70 165 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index Horn -->
    <path d="M 72 95 L 68 35 C 66 25 78 22 84 30 L 90 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Pinky Horn -->
    <path d="M 110 95 L 118 38 C 120 28 132 30 130 40 L 124 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Middle & Ring Folded Down -->
    <path d="M 88 95 C 88 120 112 120 112 95" fill="var(--secondary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Thumb Over Folded Fingers -->
    <path d="M 68 120 C 80 115 98 118 105 125" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  </symbol>

<symbol id="hand:shaka" viewBox="0 0 200 200">
    <path d="M 80 160 L 80 185 L 120 185 L 120 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Central Curled Fist -->
    <path d="M 75 110 C 75 95 88 90 100 90 C 112 90 125 95 125 110 L 125 160 L 75 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Thumb Left -->
    <path d="M 80 115 C 65 115 40 100 35 85 C 30 75 45 70 55 82 C 65 95 78 102 85 105" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Extended Pinky Right -->
    <path d="M 120 115 C 135 115 160 100 165 85 C 170 75 155 70 145 82 C 135 95 122 102 115 105" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
  </symbol>

<symbol id="hand:snap-fingers" viewBox="0 0 200 200">
    <path d="M 80 160 L 80 185 L 120 185 L 120 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Middle Finger Striking Thumb Base -->
    <path d="M 75 110 C 75 95 88 90 100 90 C 112 90 125 95 125 110 L 125 160 L 75 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index Flicked Out Upper Left -->
    <path d="M 85 92 L 60 48 C 52 38 65 30 72 40 L 95 88" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Thumb & Middle Pressed Contact -->
    <ellipse cx="102" cy="85" rx="12" ry="8" fill="var(--secondary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Snap Burst Lines -->
    <path d="M 118 70 L 132 60 M 124 82 L 140 80 M 120 96 L 135 102" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  </symbol>

<symbol id="hand:thumbs-up" viewBox="0 0 200 200">
    <!-- Wrist / Arm Base -->
    <path d="M 70 160 L 70 185 L 120 185 L 120 160" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Folded Fingers Block -->
    <path d="M 70 110 C 70 102 78 98 88 98 L 122 98 C 132 98 138 106 138 114 C 138 122 130 126 136 132 C 142 138 134 146 134 148 C 134 156 124 160 114 160 L 70 160 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Upward Thumb -->
    <path d="M 70 120 L 70 65 C 70 50 85 45 92 56 C 98 66 98 82 98 98" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" />
  </symbol>

<symbol id="hand:vulcan-salute" viewBox="0 0 200 200">
    <path d="M 75 165 L 75 185 L 125 185 L 125 165" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <path d="M 70 115 C 70 100 80 95 90 95 L 110 95 C 120 95 130 100 130 115 L 130 165 L 70 165 Z" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Index + Middle Pair -->
    <path d="M 72 95 L 68 35 C 66 25 88 22 92 32 L 94 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Ring + Pinky Pair (Split V Gap) -->
    <path d="M 106 95 L 108 32 C 112 22 134 25 132 35 L 128 95" fill="var(--primary)" stroke="var(--accent)" stroke-width="2" />
    <!-- Split Gap Center Line -->
    <line x1="100" y1="95" x2="100" y2="45" stroke="var(--accent)" stroke-width="2" />
  </symbol>

</svg>
