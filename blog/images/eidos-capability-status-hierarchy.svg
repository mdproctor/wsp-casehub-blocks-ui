<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="'SF Mono', 'Fira Code', monospace" font-size="12">
  <defs>
    <marker id="arr" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#6c7086"/>
    </marker>
  </defs>
  <rect width="680" height="340" rx="8" fill="#1e1e2e"/>
  <text x="340" y="28" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="bold">CapabilityStatus — from 3 strings to 7 typed states</text>

  <!-- Before box -->
  <rect x="30" y="50" width="180" height="120" rx="6" fill="#313244" stroke="#f38ba8" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="120" y="72" text-anchor="middle" fill="#f38ba8" font-size="11" font-weight="bold">Before (TS)</text>
  <text x="50" y="96" fill="#a6e3a1" font-size="12">● healthy</text>
  <text x="50" y="118" fill="#f9e2af" font-size="12">● degraded</text>
  <text x="50" y="140" fill="#f38ba8" font-size="12">● unavailable</text>
  <text x="50" y="160" fill="#585b70" font-size="10">3 strings, no context</text>

  <!-- Arrow -->
  <line x1="210" y1="110" x2="260" y2="110" stroke="#6c7086" stroke-width="2" marker-end="url(#arr)"/>

  <!-- After box -->
  <rect x="270" y="50" width="380" height="270" rx="6" fill="#313244" stroke="#a6e3a1" stroke-width="1"/>
  <text x="460" y="72" text-anchor="middle" fill="#a6e3a1" font-size="11" font-weight="bold">After (discriminated union)</text>

  <!-- Green states -->
  <circle cx="295" cy="98" r="5" fill="#a6e3a1"/>
  <text x="310" y="102" fill="#cdd6f4" font-size="11">Ready</text>

  <!-- Amber states -->
  <circle cx="295" cy="128" r="5" fill="#f9e2af"/>
  <text x="310" y="132" fill="#cdd6f4" font-size="11">Degraded</text>
  <text x="430" y="132" fill="#585b70" font-size="10">reason + detail</text>

  <circle cx="295" cy="158" r="5" fill="#f9e2af"/>
  <text x="310" y="162" fill="#cdd6f4" font-size="11">Overloaded</text>
  <text x="430" y="162" fill="#585b70" font-size="10">pressure + threshold</text>

  <circle cx="295" cy="188" r="5" fill="#f9e2af"/>
  <text x="310" y="192" fill="#cdd6f4" font-size="11">EpistemicallyWeak</text>
  <text x="430" y="192" fill="#585b70" font-size="10">domain + confidence</text>

  <!-- Red states -->
  <circle cx="295" cy="218" r="5" fill="#f38ba8"/>
  <text x="310" y="222" fill="#cdd6f4" font-size="11">Unavailable</text>
  <text x="430" y="222" fill="#585b70" font-size="10">reason</text>

  <circle cx="295" cy="248" r="5" fill="#f38ba8"/>
  <text x="310" y="252" fill="#cdd6f4" font-size="11">Excluded</text>
  <text x="430" y="252" fill="#585b70" font-size="10">domain + source + count</text>

  <circle cx="295" cy="278" r="5" fill="#f38ba8"/>
  <text x="310" y="282" fill="#cdd6f4" font-size="11">BehavioralViolation</text>
  <text x="430" y="282" fill="#585b70" font-size="10">violations + kind</text>

  <!-- Legend -->
  <text x="295" y="308" fill="#585b70" font-size="10">Each state carries typed context → rendered as tooltip</text>
</svg>
