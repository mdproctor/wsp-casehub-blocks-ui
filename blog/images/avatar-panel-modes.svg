<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" font-family="system-ui, sans-serif">
  <style>
    .panel { fill: #f5f7fa; stroke: #ccc; stroke-width: 1.5; rx: 8; }
    .section { stroke: #ddd; stroke-width: 1; rx: 4; }
    .avatar-bg { fill: #e3e8f0; }
    .transcript-bg { fill: #f0f4fa; }
    .input-bg { fill: #e8ecf2; }
    .controls-bg { fill: #dde3ed; }
    .label { fill: #333; font-size: 11px; }
    .sublabel { fill: #888; font-size: 9px; font-style: italic; }
    .title { fill: #1a1a2e; font-size: 14px; font-weight: 600; }
    .mode-label { fill: #2d5aa0; font-size: 13px; font-weight: 600; }
    .hidden { fill: #f0f0f0; stroke: #ddd; stroke-dasharray: 4 3; }
    .hidden-text { fill: #bbb; font-size: 10px; }
    .x-mark { fill: #c44; font-size: 16px; font-weight: 700; }
  </style>

  <text x="330" y="24" text-anchor="middle" class="title">casehub-avatar-panel — showAvatar: true vs false</text>

  <!-- Full mode panel -->
  <text x="150" y="52" text-anchor="middle" class="mode-label">showAvatar: true</text>
  <rect x="20" y="60" width="260" height="250" class="panel"/>

  <rect x="28" y="68" width="244" height="24" class="section controls-bg"/>
  <text x="150" y="84" text-anchor="middle" class="label">avatar-controls</text>
  <text x="150" y="94" text-anchor="middle" class="sublabel">voice, LLM, speed</text>

  <rect x="28" y="96" width="244" height="80" class="section avatar-bg"/>
  <text x="150" y="140" text-anchor="middle" class="label">casehub-avatar</text>
  <text x="150" y="154" text-anchor="middle" class="sublabel">3D TalkingHead (lazy)</text>

  <rect x="28" y="180" width="244" height="16" class="section" style="fill:#f8f9fb"/>
  <text x="150" y="192" text-anchor="middle" class="sublabel">status + timing</text>

  <rect x="28" y="200" width="244" height="72" class="section transcript-bg"/>
  <text x="150" y="240" text-anchor="middle" class="label">casehub-transcript</text>

  <rect x="28" y="276" width="244" height="28" class="section input-bg"/>
  <text x="80" y="294" text-anchor="middle" class="sublabel">mic</text>
  <text x="150" y="294" text-anchor="middle" class="label">input</text>
  <text x="240" y="294" text-anchor="middle" class="sublabel">send</text>

  <!-- Text-only panel -->
  <text x="510" y="52" text-anchor="middle" class="mode-label">showAvatar: false</text>
  <rect x="380" y="60" width="260" height="250" class="panel"/>

  <rect x="388" y="68" width="244" height="24" class="section hidden"/>
  <text x="460" y="84" text-anchor="middle" class="hidden-text">controls hidden</text>
  <text x="586" y="84" class="x-mark">X</text>

  <rect x="388" y="96" width="244" height="80" class="section hidden"/>
  <text x="460" y="140" text-anchor="middle" class="hidden-text">avatar hidden</text>
  <text x="586" y="140" class="x-mark">X</text>
  <text x="510" y="158" text-anchor="middle" class="hidden-text">TalkingHead never loads</text>

  <rect x="388" y="180" width="244" height="16" class="section" style="fill:#f8f9fb"/>
  <text x="510" y="192" text-anchor="middle" class="sublabel">status only</text>

  <rect x="388" y="200" width="244" height="72" class="section transcript-bg"/>
  <text x="510" y="240" text-anchor="middle" class="label">casehub-transcript</text>
  <text x="510" y="254" text-anchor="middle" class="sublabel">fills available space</text>

  <rect x="388" y="276" width="244" height="28" class="section input-bg"/>
  <text x="510" y="294" text-anchor="middle" class="label">input + send</text>
  <text x="445" y="294" text-anchor="middle" class="hidden-text"></text>
</svg>